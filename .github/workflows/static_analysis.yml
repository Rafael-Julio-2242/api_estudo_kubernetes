name: Static Analys
run-name: Static Analysis workflow
on: [push]
jobs:
  Execute-typechecks-linter-format:
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck
